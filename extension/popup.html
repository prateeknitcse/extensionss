<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font: 13px system-ui; width: 260px; padding: 10px; }
  h3 { margin: 4px 0; }
  input { width: 100%; margin: 3px 0; padding: 4px; box-sizing: border-box; }
  button { width: 100%; padding: 6px; margin-top: 4px; }
  #status { margin-top: 4px; min-height: 1em; color: #b00020; }
  #status.ok { color: #1b7f3b; }
  #rank { margin-top: 8px; font-weight: bold; }
  #lb { margin-top: 6px; }
  #lb div { display: flex; justify-content: space-between; padding: 2px 0; }
  #lb span:first-child { overflow: hidden; text-overflow: ellipsis; margin-right: 8px; }
  .me { font-weight: bold; }
</style>
</head>
<body>
  <h3>Scroll Leaderboard</h3>
  <div id="today">Today: — m</div>
  <input id="username" placeholder="Username (3-20: a-z 0-9 _ -)" maxlength="20">
  <button id="save">Save</button>
  <div id="status"></div>
  <div id="rank"></div>
  <div id="lb"></div>
  <button id="refresh">Refresh leaderboard</button>
  <script src="config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
