<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --paper: #f4efe6;
    --ink: #1d1b17;
    --muted: #6f685c;
    --line: #cfc7b6;
    --accent: #b3341a;
    --mark: #f3dc7a;
    --field: #fffdf8;
    --ok: #2f6b3a;
    --mono: ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace;
    --serif: Georgia, "Times New Roman", serif;
  }
  :root[data-theme="dark"] {
    --paper: #1a1814;
    --ink: #ece6d8;
    --muted: #9b9384;
    --line: #3a362d;
    --accent: #e8714f;
    --mark: #4d4214;
    --field: #24211b;
    --ok: #6fbf7e;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #1a1814;
      --ink: #ece6d8;
      --muted: #9b9384;
      --line: #3a362d;
      --accent: #e8714f;
      --mark: #4d4214;
      --field: #24211b;
      --ok: #6fbf7e;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    width: 320px;
    padding: 16px 16px 12px;
    background: var(--paper);
    color: var(--ink);
    font: 13px/1.4 system-ui, "Segoe UI", sans-serif;
  }

  header { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 2px solid var(--ink); padding-bottom: 6px; }
  h1 { margin: 0; font: italic 700 19px var(--serif); letter-spacing: -0.2px; }
  #now { font: 10.5px var(--mono); color: var(--muted); text-align: right; }

  .today { padding: 14px 0 10px; border-bottom: 1px solid var(--line); }
  .label { font: 10px var(--mono); text-transform: uppercase; letter-spacing: 1.2px; color: var(--muted); }
  .big { font: 700 38px/1.1 var(--serif); font-variant-numeric: tabular-nums; }
  .big small { font: 14px var(--mono); color: var(--muted); margin-left: 3px; }

  #rank { margin: 10px 0 0; font: 12px var(--mono); min-height: 1.4em; }
  #rank b { color: var(--accent); }

  .week { margin-top: 12px; }
  #lb { margin-top: 4px; font: 12.5px var(--mono); }
  .row { display: grid; grid-template-columns: 26px 1fr auto; gap: 6px; padding: 5px 4px; border-bottom: 1px dotted var(--line); }
  .row .n { color: var(--muted); }
  .row .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .m { font-variant-numeric: tabular-nums; }
  .row.me { background: var(--mark); border-bottom-color: transparent; font-weight: 700; }
  .empty { color: var(--muted); padding: 6px 0; }

  [hidden] { display: none !important; }
  .account { display: flex; justify-content: space-between; align-items: end; margin-top: 14px; padding-top: 10px; border-top: 2px solid var(--ink); }
  .who { font: 700 14px var(--mono); }
  .link { padding: 0; border: 0; background: none; color: var(--muted); text-transform: none; letter-spacing: 0; text-decoration: underline; font: 11px var(--mono); }
  .link:hover { color: var(--accent); background: none; }
  form { margin-top: 14px; padding-top: 10px; border-top: 2px solid var(--ink); }
  .field { display: flex; margin-top: 3px; }
  input {
    flex: 1; min-width: 0;
    padding: 6px 8px;
    border: 1px solid var(--ink); border-right: 0; border-radius: 0;
    background: var(--field); color: var(--ink);
    font: 13px var(--mono);
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: -2px; }
  button {
    padding: 6px 12px; border: 1px solid var(--ink); border-radius: 0;
    background: var(--ink); color: var(--paper);
    font: 11px var(--mono); text-transform: uppercase; letter-spacing: 1px; cursor: pointer;
  }
  button:hover { background: var(--accent); border-color: var(--accent); }
  #status { min-height: 1.3em; margin-top: 4px; font: 11.5px var(--mono); color: var(--accent); }
  #status.ok { color: var(--ok); }
  .foot-actions { display: flex; gap: 12px; }
  #theme { padding: 0; border: 0; background: none; color: var(--muted); text-transform: none; letter-spacing: 0; text-decoration: underline; font: 10.5px var(--mono); }
  #theme:hover { color: var(--accent); background: none; }

  footer { display: flex; justify-content: space-between; margin-top: 6px; font: 10.5px var(--mono); color: var(--muted); }
  #refresh { padding: 0; border: 0; background: none; color: var(--muted); text-transform: none; letter-spacing: 0; text-decoration: underline; font: 10.5px var(--mono); }
  #refresh:hover { color: var(--accent); background: none; }
</style>
</head>
<body>
  <header>
    <h1>Scroll Leaderboard</h1>
    <div id="now"></div>
  </header>

  <section class="today">
    <div class="label">Scrolled today</div>
    <div class="big"><span id="todayVal">0.0</span><small>m</small></div>
  </section>

  <div id="rank"></div>

  <section class="week">
    <div class="label">This week &middot; top 10</div>
    <div id="lb"></div>
  </section>

  <section id="current" class="account" hidden>
    <div>
      <div class="label">Playing as</div>
      <div id="currentName" class="who"></div>
    </div>
    <button id="change" type="button" class="link">change</button>
  </section>

  <form id="form" hidden>
    <label class="label" for="username">Your username</label>
    <div class="field">
      <input id="username" maxlength="20" placeholder="3-20: a-z 0-9 _ -" autocomplete="off">
      <button id="save" type="submit">Save</button>
    </div>
    <div id="status"></div>
  </form>

  <footer>
    <span>resets Mon 00:00 UTC</span>
    <span class="foot-actions">
      <button id="theme" type="button"></button>
      <button id="refresh" type="button">refresh</button>
    </span>
  </footer>

  <script src="config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
